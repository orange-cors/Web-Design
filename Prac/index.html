<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <div class="container">
        <div class="title">HOÁ ĐƠN TIỀN PHÒNG</div>

        <div class="form">
            <div class="form-grid">
                <div class="form-group">
                    <label>Mã Hóa Đơn:</label>
                    <input type="text" id="maHD">
                </div>
                <div class="form-group">
                    <label>Tên Khách:</label>
                    <input type="text" id="tenKH">
                </div>
                <div class="form-group">
                    <label>Loại Phòng:</label>
                    <input type="text" id="loaiPhong">
                </div>
                <div class="form-group">
                    <label>Số Ngày Thuê:</label>
                    <input type="text" id="soNgay">
                </div>
                <div class="form-group">
                    <label>Tiền Phải Trả:</label>
                    <input type="text" id="tienTra">
                </div>
                <div class="form-group">
                    <label>Loại Khách Hàng:</label>
                    <input type="text" id="loaiKH">
                </div>
            </div>

            <div class="btn">
                <button onclick="tinhTien()">Tính Tiền</button>
                <button onclick="huyBo()">Hủy Bỏ</button>
            </div>
        </div>
    </div>
</body>
</html>
